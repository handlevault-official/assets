<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Crisp Suite</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 450px;
            padding: 20px;
        }
        /* Sukat para sa mascot GIF (mga 250px para sakto sa mata) */
        .mascot-gif {
            width: 250px;
            height: 250px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 12px;
        }
        h1 {
            font-size: 3.5rem;
            margin: 0 0 10px 0;
            color: #38bdf8;
            font-weight: 800;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            padding: 12px 28px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: #0ea5e9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ang ating funny running horse mascot GIF -->
        <img src="horse.gif" alt="Running Horse Mascot 404" class="mascot-gif">
        
        <h1>404</h1>
        <p>Oops! Mukhang tumakbo nang palayo ang ating mascot at napunta ka sa isang pahinang hindi umiiral.</p>
        
        <a href="index.html" class="btn">Balik sa Home</a>
    </div>

</body>
</html>
